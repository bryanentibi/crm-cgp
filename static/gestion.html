  <style>
    html,body,#root{margin:0;padding:0;min-height:100vh;background:#F5F7FA}
    #boot{display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0B2545 0%,#13315C 60%,#1d4066 100%);color:#fff;font-family:Georgia,serif;font-size:22px;letter-spacing:1px}

    #boot .spin{width:26px;height:26px;border:3px solid rgba(201,162,75,.25);border-top-color:#C9A24B;border-radius:50%;animation:sp .8s linear infinite}
